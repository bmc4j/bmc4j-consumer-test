name: Consumer test

# Pulls the requested bmc4j version BY COORDINATES from GitHub Packages and runs
# the consumer proofs on all three OS families - the "does the published product
# actually install and work" test. Both proofs pass when the product is healthy
# (the deliberate bug declares expect = REFUTED), so a green `gradlew test` is the
# whole assertion.
#
# No PAT needed: GitHub Packages requires SOME authenticated token for Maven reads
# even on public packages, but for a PUBLIC repo's packages ANY token with
# packages:read works - including this workflow's own GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'bmc4j version to consume (e.g. 0.1.0 or 0.1.0-rc.1)'
        required: true
        default: '0.1.0'

permissions:
  contents: read
  packages: read

jobs:
  consume:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Consume bmc4j ${{ inputs.version }} and run the proofs
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew test -PbmcVersion=${{ inputs.version }} --no-daemon
